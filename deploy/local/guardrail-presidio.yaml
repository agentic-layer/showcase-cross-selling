# Presidio PII masking guardrail for the AiGateway.
# Requires presidio.yaml to be deployed first.
---
# GuardrailProvider references the Presidio backend service.
apiVersion: runtime.agentic-layer.ai/v1alpha1
kind: GuardrailProvider
metadata:
  name: presidio
  namespace: ai-gateway
spec:
  type: presidio-api
  presidio:
    baseUrl: "http://presidio:80"
---
# Guard defines when the guardrail is applied and references the provider.
apiVersion: runtime.agentic-layer.ai/v1alpha1
kind: Guard
metadata:
  name: pii-guard
  namespace: ai-gateway
spec:
  mode:
    - pre_call
    - post_call
  description: Detect and mask PII in user inputs before they are sent to the LLM.
  providerRef:
    name: presidio
    namespace: ai-gateway
  presidio:
    language: "de"
    scoreThresholds:
      ALL: "0.7"
      # PhoneRecognizer scores German numbers around 0.4 in JSON-value context
      # (e.g. "phone":"+49 30 12345678"). The global 0.7 threshold filters
      # those out, so we lower it for PHONE_NUMBER specifically.
      PHONE_NUMBER: "0.4"
    # Per-entity actions: "MASK" redacts the entity, "BLOCK" rejects the request.
    # The keys also determine which entity types are detected.
    # LOCATION is intentionally omitted: Presidio's German SpacyRecognizer
    # produces severe false positives on prompt content (e.g. masks the word
    # "German" in 'ALWAYS respond in German') without reliably catching full
    # street addresses. Address masking would require a custom recognizer in
    # the upstream Presidio image and is deferred as a follow-up.
    entityActions:
      EMAIL_ADDRESS: "MASK"
      PHONE_NUMBER: "MASK"
      CREDIT_CARD: "BLOCK"
